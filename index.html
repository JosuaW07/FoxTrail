<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> 
    <script src="script.js" defer></script>
    <title>FoxTrail</title>
</head>
<body>
    <h1>FoxTrail</h1>
    <div id="quiz">
        <div class="question" id="q1">
            <label class="terminal">&gt; 2+2?</label>
            <br/>
            <input type="text" id="input1" onkeyup="checkAnswer(1, '4')" class="terminal">
        </div>
        <div class="question" id="q2" style="display:none;">
            <label class="terminal">&gt; capital of France?</label>
            <br/>
            <input type="text" id="input2" onkeyup="checkAnswer(2, 'Paris')" class="terminal">
        </div>
    </div>
</body>
<footer>
    <h3>Tymur Arduch; Josua Welsche; Laurens Hertzer ©</h3>
</footer>
</html>
